# Capítulo 16: arquitetura de banco de dados relacional.
# A linguagem vem do arquivo .env (LINGUAGEM=node|php|python|java).
services:
  # Aplica as migrações e roda os experimentos de consulta e de isolamento
  app:
    build: ./${LINGUAGEM:-node}
    # Uma imagem por linguagem: trocar o .env não reaproveita a imagem de outra
    image: morada-cap16-${LINGUAGEM:-node}
    environment:
      BANCO_URL: postgresql://morada:morada@banco:5432/morada
    volumes:
      - ./entrada:/dados/entrada:ro
      - ./migracoes:/dados/migracoes:ro
      - ./saida:/dados/saida
    depends_on:
      banco:
        condition: service_healthy

  banco:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: morada
      POSTGRES_PASSWORD: morada
      POSTGRES_DB: morada
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "morada"]
      interval: 2s
      retries: 30

  # Compara a saída com o resultado aprovado
  ferramentas:
    build: ./ferramentas
    volumes:
      - ./:/cap16
    working_dir: /cap16
