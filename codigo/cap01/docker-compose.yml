# Capítulo 1: o custo de mudar.
# A linguagem vem do arquivo .env (LINGUAGEM=node|php|python|java).
services:
  # Roda uma etapa do Morada ou os testes unitários da linguagem escolhida
  app:
    build: ./${LINGUAGEM:-node}
    # Uma imagem por linguagem: trocar o .env não reaproveita a imagem de outra
    image: morada-cap01-${LINGUAGEM:-node}
    environment:
      HOJE: ${HOJE:-2026-03-02}
    volumes:
      - ./entrada:/dados/entrada:ro
      - ./saida:/dados/saida

  # Compara a saída com o resultado aprovado e mede o tamanho das mudanças
  ferramentas:
    build: ./ferramentas
    environment:
      LINGUAGEM: ${LINGUAGEM:-node}
    volumes:
      - ./:/cap01
    working_dir: /cap01
