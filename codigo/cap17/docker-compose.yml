# Capítulo 17: multi-tenancy em SaaS.
# A linguagem vem do arquivo .env (LINGUAGEM=node|php|python|java).
services:
  # O vazamento entre condomínios e a correção com RLS; o vizinho barulhento
  app:
    build: ./${LINGUAGEM:-node}
    # Uma imagem por linguagem: trocar o .env não reaproveita a imagem de outra
    image: morada-cap17-${LINGUAGEM:-node}
    environment:
      # O administrador cria as tabelas; a aplicação usa um papel sem privilégios
      BANCO_URL: postgresql://morada:morada@banco:5432/morada
      APP_BANCO_URL: postgresql://app_morada:app_morada@banco:5432/morada
    volumes:
      - ./entrada:/dados/entrada:ro
      - ./sql:/dados/sql:ro
      - ./saida:/dados/saida
    depends_on:
      banco:
        condition: service_healthy

  banco:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: morada
      POSTGRES_PASSWORD: morada
      POSTGRES_DB: morada
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "morada"]
      interval: 2s
      retries: 30

  # Compara a saída com o resultado aprovado
  ferramentas:
    build: ./ferramentas
    volumes:
      - ./:/cap17
    working_dir: /cap17
