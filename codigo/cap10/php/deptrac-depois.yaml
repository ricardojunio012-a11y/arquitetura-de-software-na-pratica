# Teste de arquitetura: as regras de fronteira entre os módulos do monólito.
deptrac:
  paths:
    - ./src/depois
  layers:
    - name: Reservas
      collectors:
        - type: directory
          value: src/depois/modulos/reservas/.*
    - name: FinanceiroApi
      collectors:
        - type: directory
          value: src/depois/modulos/financeiro/api.php
    - name: FinanceiroInterno
      collectors:
        - type: directory
          value: src/depois/modulos/financeiro/interno/.*
  ruleset:
    # Reservas só pode usar a API pública do Financeiro, nunca a tabela dele
    Reservas:
      - FinanceiroApi
    FinanceiroApi:
      - FinanceiroInterno
    FinanceiroInterno: ~
