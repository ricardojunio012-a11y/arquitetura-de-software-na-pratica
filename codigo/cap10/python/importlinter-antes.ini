# Teste de arquitetura: as regras de fronteira entre os módulos do monólito.
[importlinter]
root_package = morada

[importlinter:contract:reservas]
name = Reservas só usa a API pública do Financeiro
type = forbidden
source_modules = morada.antes.modulos.reservas
forbidden_modules = morada.antes.modulos.financeiro.interno
# A API do Financeiro usa a tabela dele: isso é permitido, o atalho direto não
allow_indirect_imports = True

[importlinter:contract:financeiro]
name = O Financeiro não depende de Reservas
type = forbidden
source_modules = morada.antes.modulos.financeiro
forbidden_modules = morada.antes.modulos.reservas
