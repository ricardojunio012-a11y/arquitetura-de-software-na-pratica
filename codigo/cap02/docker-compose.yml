# Capítulo 2: requisitos de qualidade e comunicação da arquitetura.
# A linguagem vem do arquivo .env (LINGUAGEM=node|php|python|java).
services:
  # Roda os cenários de qualidade executáveis ou os testes da linguagem escolhida
  app:
    build: ./${LINGUAGEM:-node}
    image: morada-cap02-${LINGUAGEM:-node}
    # O ambiente faz parte do cenário de desempenho: limites explícitos de CPU e memória
    cpus: ${CPUS:-1.0}
    mem_limit: ${MEMORIA:-512m}
    volumes:
      - ./cenarios:/dados/cenarios:ro

  # Structurizr (modo local): desenha os diagramas C4 a partir de docs/c4/workspace.dsl
  structurizr:
    image: structurizr/structurizr
    command: ["local"]
    ports:
      - "8080:8080"
    volumes:
      - ./docs/c4:/usr/local/structurizr
