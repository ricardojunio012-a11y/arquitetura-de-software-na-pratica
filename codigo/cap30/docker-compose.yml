# Capítulo 30: transações distribuídas e Sagas.
services:
  # O onboarding de um condomínio novo, em quatro serviços, coordenado por uma saga
  app:
    build: ./node
    image: morada-cap30-node
    environment:
      BANCO_URL: postgresql://morada:morada@banco:5432/morada
    volumes:
      - ./sql:/dados/sql:ro
      - ./saida:/dados/saida
    depends_on:
      banco:
        condition: service_healthy

  banco:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: morada
      POSTGRES_PASSWORD: morada
      POSTGRES_DB: morada
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "morada"]
      interval: 2s
      retries: 30

  # Compara a saída com o resultado aprovado
  ferramentas:
    build: ./ferramentas
    volumes:
      - ./:/cap30
    working_dir: /cap30
