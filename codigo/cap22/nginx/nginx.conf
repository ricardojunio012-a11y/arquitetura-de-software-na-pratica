# Balanceador do laboratório: round robin entre três réplicas da API.
# Um processo só, para a distribuição dos pedidos ser previsível no laboratório.
worker_processes 1;
events {}

http {
  upstream api {
    # Verificação passiva: uma falha de conexão tira a réplica de circulação por 30 s
    server api1:3000 max_fails=1 fail_timeout=30s;
    server api2:3000 max_fails=1 fail_timeout=30s;
    server api3:3000 max_fails=1 fail_timeout=30s;
  }

  server {
    listen 80;
    location / {
      proxy_pass http://api;
      # Se a réplica recusar a conexão, o mesmo pedido vai para a próxima
      proxy_next_upstream error timeout;
      proxy_connect_timeout 1s;
    }
  }
}
